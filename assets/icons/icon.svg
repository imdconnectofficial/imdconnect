<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="50%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E0E7FF"/>
        </linearGradient>
        <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
        </filter>
        <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Squircle Background -->
    <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
    
    <!-- Subtle Top Highlight Accent -->
    <path d="M 116 0 L 396 0 C 460 0 512 52 512 116 L 512 160 C 420 120 300 110 0 160 L 0 116 C 0 52 52 0 116 0 Z" fill="#FFFFFF" opacity="0.08"/>

    <!-- Main Chat Bubble with Shield Lock Silhouette -->
    <g filter="url(#dropShadow)" transform="translate(0, 4)">
        <!-- Speech Bubble Base -->
        <path d="M 256 96 C 160 96 82 166 82 252 C 82 296 102 336 136 364 C 130 398 114 424 96 440 C 134 440 182 422 216 398 C 229 401 242 404 256 404 C 352 404 430 334 430 252 C 430 166 352 96 256 96 Z" 
              fill="url(#shieldGrad)"/>

        <!-- Privacy Shield Center Core -->
        <path d="M 256 160 C 280 188 316 196 330 198 C 330 268 288 322 256 342 C 224 322 182 268 182 198 C 196 196 232 188 256 160 Z" 
              fill="url(#bgGrad)" opacity="0.95"/>

        <!-- Keyhole / Secure Core Dot -->
        <circle cx="256" cy="236" r="18" fill="#FFFFFF"/>
        <path d="M 250 248 L 262 248 L 266 284 L 246 284 Z" fill="#FFFFFF"/>
    </g>
</svg>
