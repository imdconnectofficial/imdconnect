<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="description" content="ImdConnect — Connect Privately. Chat Freely. High-performance, username-based text messaging platform.">
    
    <!-- PWA Theme & Installable Metadata -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ImdConnect">
    <meta name="application-name" content="ImdConnect">

    <title>ImdConnect — Connect Privately. Chat Freely.</title>

    <!-- PWA Web Manifest & Icons -->
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./src/styles/tokens.css">
    <link rel="stylesheet" href="./src/styles/auth.css">
    <link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
    <!-- Global Realtime & Offline Connection Status Indicator -->
    <div id="connection-status-banner" class="connection-status-banner" style="display: none;" role="status" aria-live="polite">
        <div class="connection-status-inner">
            <span class="connection-status-icon" id="connection-status-icon">⚡</span>
            <span class="connection-status-text" id="connection-status-text">Reconnecting...</span>
        </div>
    </div>

    <div id="app" role="application"></div>

    <!-- Application Script (Native ES Module) -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
